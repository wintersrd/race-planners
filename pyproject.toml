[project]
name = "race-planners"
version = "0.1.0"
description = "Race planning Streamlit applications"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "matplotlib>=3.10.0",
  "numpy>=2.3.0",
  "pandas>=2.3.0",
  "streamlit>=1.46.0",
]

[dependency-groups]
dev = [
  "mypy>=1.16.0",
  "pre-commit>=4.2.0",
  "pytest>=8.4.0",
  "ruff>=0.11.0",
]
notebook = [
  "ipywidgets>=8.1.0",
  "voila>=0.5.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [
  "semi-marathon-finistere/app.py",
  "semi-marathon-finistere/race_planner_semi_marathon_finistere.ipynb",
]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = [
  "semi-marathon-finistere/app.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
