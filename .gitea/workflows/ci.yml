name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Sync dependencies
        run: uv sync --frozen --python 3.13

      - name: Ruff check
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy tests

      - name: Pytest
        run: uv run pytest

      - name: Check Streamlit requirements export
        run: scripts/check_streamlit_requirements.sh
